extend-exclude = ["docs/source/conf.py", "packages/*/tests/data", "packages/*/*/_version.py"]
line-length = 100
src = ["packages/bids_inventory", "packages/cohort_creator"]
target-version = "py310"

[lint]
ignore = ["D101", "D103", "E501"]
mccabe = { max-complexity = 12 }
# E, W: pycodestyle / F: pyflakes / C90: mccabe / D: pydocstyle
# I: isort / UP: pyupgrade / FLY: flynt
select = ["C90", "D", "E", "F", "FLY", "I", "UP", "W"]

[lint.per-file-ignores]
"**/tests/*" = ["D100", "D104"]
"__init__.py" = ["D104"]

[lint.pydocstyle]
convention = "numpy"
