---
# Default configuration of `bids_inventory update`.
#
# Do not put your own paths here:
# copy the keys you need in your own YAML file and pass it with
#   bids_inventory update --config my_config.yml
# or set the BIDS_INVENTORY_CONFIG environment variable to its path.
# Values from your file are merged over these defaults. `~` is expanded.
auth:
    # GitHub API calls are rate limited: authenticated calls get a higher limit.
    # If the GITHUB_TOKEN environment variable is set, it is used.
    # Otherwise set the path to a text file containing a GitHub token.
    username:
    token_file:
local_paths:
    openneuro:
        # folder where the openneuro datasets missing from the superdataset are installed
        OpenNeuroDatasets:
    datalad:
        # required: openneuro folder of the datalad superdataset
        # (datalad install ///openneuro).
        # Datasets are indexed from it, and installed in it if needed.
        OpenNeuroDatasets:
        # required: folder of the datalad superdataset of the openneuro derivatives
        # (datalad install ///openneuro-derivatives).
        # Derivatives are listed, and their version read, from it first.
        OpenNeuroDerivatives:
    # folder with the datasets that are not on openneuro
    # (abide, abide2, adhd200, corr and cneuromod subfolders),
    # for example installed with tools/install_extra_datasets.sh
    # only needed for: bids_inventory update --source non-openneuro
    non_openneuro:
