[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
authors = [{ name = "Rémi Gau" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "datalad",
    "datalad-fuse",
    "mne",
    "nibabel",
    "numpy",
    "pandas",
    "pyyaml",
    "requests",
    "rich",
    "rich_argparse"
]
description = "Keeps an inventory of publicly available BIDS datasets."
dynamic = ["version"]
license = { text = "MIT" }
maintainers = [{ name = "Rémi Gau", email = "remi.gau@gmail.com" }]
name = "bids-inventory"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["bids-inventory[test]", "pandas-stubs", "pre-commit"]
test = ["pytest", "pytest-cov"]

[project.scripts]
bids_inventory = "bids_inventory._cli:cli"

[project.urls]
"Bug tracker" = "https://github.com/neurodatascience/cohort_creator/issues"
Homepage = "https://github.com/neurodatascience/cohort_creator"

[tool.hatch.build.hooks.vcs]
version-file = "bids_inventory/_version.py"

[tool.hatch.build.targets.wheel]
exclude = ["bids_inventory/data/tmp"]
packages = ["bids_inventory"]

[tool.hatch.version]
raw-options = { root = "../.." }
source = "vcs"

[tool.pytest.ini_options]
addopts = "-ra -q -vv --showlocals --strict-markers --strict-config --cov bids_inventory --cov-report=html"
minversion = "6.0.0"
norecursedirs = "data"
testpaths = ["tests/"]
xfail_strict = true
