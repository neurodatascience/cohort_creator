---
# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

submodules:
    include: all

build:
    os: ubuntu-22.04
    tools:
        python: '3.11'

python:
    install:
    -   method: pip
        path: packages/bids_inventory
    -   method: pip
        path: packages/cohort_creator
        extra_requirements:
        -   docs

sphinx:
    configuration: docs/source/conf.py
    builder: html
    fail_on_warning: false
