[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
authors = [{ name = "Rémi Gau" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "dash",
    "dash-bootstrap-components",
    "datalad",
    'datalad-fuse',
    "kaleido",
    "matplotlib",
    "mne",
    'nibabel',
    "pandas",
    "pybids",
    "plotly",
    "pyyaml",
    "requests",
    "rich",
    "rich_argparse"
]
description = "Creates a neuroimaging cohort by aggregating data across datasets."
dynamic = ["version"]
license = { text = "MIT" }
maintainers = [{ name = "Rémi Gau", email = "remi.gau@gmail.com" }]
name = "cohort_creator"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "cohort_creator[doc,test]",
    "gender_guesser",
    "pandas-stubs",
    "pre-commit"
]
doc = [
    "furo",
    "myst-parser",
    "numpydoc",
    "sphinx",
    "sphinx-argparse",
    "sphinx-copybutton"
]
docs = ["cohort_creator[doc]"]
test = ["pytest", "pytest-cov"]
tests = ["cohort_creator[test]"]

[project.scripts]
cohort_creator = "cohort_creator._cli:cli"

[project.urls]
"Bug trakcer" = "https://github.com/neurodatascience/cohort_creator/issues"
Documentation = "https://cohort-creator.readthedocs.io/en/latest/"
Homepage = "https://github.com/neurodatascience/cohort_creator"

[tool.codespell]
skip = "./.git,env,venv,outputs,htmlcov,bids-examples,**/openneuro.tsv,locations.tsv"

[tool.hatch.build.hooks.vcs]
version-file = "cohort_creator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["cohort_creator"]

[tool.hatch.version]
source = "vcs"

[tool.pyrefly]
ignore-missing-imports = [
    "bids.*",
    "cohort_creator._version",
    "dash.*",
    "dash_bootstrap_components.*",
    "datalad.*",
    "geopy.*",
    "matplotlib",
    "mne.*",
    "plotly.*",
    "rich.*",
    "rich_argparse"
]
project-excludes = ["cohort_creator/_version.py"]
project-includes = ["cohort_creator"]

[tool.pytest.ini_options]
addopts = "-ra -q -vv --showlocals --strict-markers --strict-config --cov cohort_creator --cov-report=html"
# filterwarnings = ["error"]
# log_cli_level = "warning"
minversion = "6.0.0"
norecursedirs = "data"
testpaths = ["tests/"]
xfail_strict = true

[tool.ruff]
extend-exclude = ["docs/source/conf.py", "tests/data", "cohort_creator/_version.py"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["D101", "D103", "E501"]
mccabe = { max-complexity = 12 }
# E, W: pycodestyle / F: pyflakes / C90: mccabe / D: pydocstyle
# I: isort / UP: pyupgrade / FLY: flynt
select = ["C90", "D", "E", "F", "FLY", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/*" = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
