---
name: test

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [main]
    pull_request:
        branches: ['*']

jobs:
    unit_test:
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

        runs-on: ubuntu-latest

        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                submodules: recursive

        -   name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v7
            with:
                python-version: ${{ matrix.python-version }}
                allow-prereleases: true

        -   name: Install dependencies
            run: |
                sudo apt-get update
                sudo apt-get install -y git-annex
                python -m pip install --upgrade pip

        # TODO: install the 'browse' extra on all versions
        # once loro (a dependency of marimo) publishes wheels for python 3.15:
        # it cannot be built from source yet (PyO3 only supports python <= 3.14).
        # The tests of the dashboard are skipped without it.
        -   name: Install
            run: >
                pip install
                ./packages/bids_inventory[${{ matrix.python-version == '3.15' && 'test,update' || 'browse,test,update' }}]
                ./packages/cohort_creator[test]

        -   name: Post-install
            run: |
                git config --global --add user.name "Ford Escort"
                git config --global --add user.email 42@H2G2.com

        -   name: Check set up
            run: |
                datalad wtf
                bids_inventory --version
                cohort_creator --version

        -   name: unit tests bids_inventory
            working-directory: packages/bids_inventory
            run: python -m pytest --cov-report=xml

        -   name: unit tests cohort_creator
            working-directory: packages/cohort_creator
            run: python -m pytest --cov-report=xml

        -   name: Upload coverage to Codecov
            uses: codecov/codecov-action@v7
            with:
                files: ./packages/bids_inventory/coverage.xml,./packages/cohort_creator/coverage.xml
                name: codecov-umbrella
                fail_ci_if_error: false
