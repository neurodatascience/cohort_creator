---
name: test

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [main]
    pull_request:
        branches: ['*']

jobs:
    unit_test:
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

        runs-on: ubuntu-latest

        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                submodules: recursive

        -   name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v7
            with:
                python-version: ${{ matrix.python-version }}
                allow-prereleases: true

        -   name: Install dependencies
            run: |
                sudo apt-get update
                sudo apt-get install -y git-annex
                python -m pip install --upgrade pip

        # bids_inventory is a submodule: its tests run in its own repository
        -   name: Install
            run: pip install ./packages/bids_inventory ./packages/cohort_creator[test]

        -   name: Post-install
            run: |
                git config --global --add user.name "Ford Escort"
                git config --global --add user.email 42@H2G2.com

        -   name: Check set up
            run: |
                datalad wtf
                cohort_creator --version

        -   name: unit tests cohort_creator
            working-directory: packages/cohort_creator
            run: python -m pytest --cov-report=xml

        -   name: Upload coverage to Codecov
            uses: codecov/codecov-action@v7
            with:
                files: ./packages/cohort_creator/coverage.xml
                fail_ci_if_error: false
